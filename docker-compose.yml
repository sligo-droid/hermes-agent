#
# Deprecated local Docker Compose entrypoint.
#
# This repository used to ship an active Compose stack that created containers
# named `hermes` and `hermes-dashboard` and bind-mounted ~/.hermes into
# /opt/data. On host-based installs that was too easy to start accidentally:
# the container entrypoint can chown the real host ~/.hermes directory and break
# the running host gateway.
#
# Keep this file as an inert guard so `docker compose up` from the repository
# root fails with "no service selected" instead of starting Hermes containers.
# If you intentionally run Hermes in Docker, use an explicit compose file
# outside this checkout and set HERMES_UID/HERMES_GID to the host user.
#
name: hermes-docker-compose-deprecated
services: {}

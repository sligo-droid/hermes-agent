name: Basic Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'assets/**'
      - 'infographic/**'
      - 'locales/**'
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'assets/**'
      - 'infographic/**'
      - 'locales/**'
      - '**/*.md'
      - 'docs/**'
      - 'website/**'

permissions:
  contents: read

concurrency:
  group: basic-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    name: basic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Compile core Python packages
        run: |
          source .venv/bin/activate
          python -m compileall hermes_cli gateway plugins tools agent -q

      - name: Run fork smoke suite
        run: |
          scripts/run_tests.sh --smoke -q --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

name: Basic Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Source CI and PR-body validation use separate groups: the latter runs
  # trusted base code under pull_request_target, while this workflow runs PR
  # source and must never cancel it.
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.changes.outputs.python }}
      frontend: ${{ steps.changes.outputs.frontend }}
      site: ${{ steps.changes.outputs.site }}
      docker_meta: ${{ steps.changes.outputs.docker_meta }}
      scan: ${{ steps.changes.outputs.scan }}
      deps: ${{ steps.changes.outputs.deps }}
      mcp_catalog: ${{ steps.changes.outputs.mcp_catalog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Resolve bounded changed range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/ci/resolve_changed_range.py \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" > /tmp/hermes-changed-paths.txt

      - name: Classify changed surfaces
        id: changes
        run: python scripts/ci/classify_changes.py < /tmp/hermes-changed-paths.txt

      - name: Run source-CI preflight
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/source_ci_preflight.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-number "$PR_NUMBER"

  python:
    name: python
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Compile core Python packages
        run: |
          source .venv/bin/activate
          python -m compileall hermes_cli gateway plugins tools agent -q

      - name: Run fork smoke suite
        run: scripts/run_tests.sh --smoke -q --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  frontend:
    name: frontend
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm install -g npm@11.14.1
          npm ci

      - name: Run frontend typechecks and desktop build
        run: |
          npm run --workspace ui-tui typecheck
          npm run --workspace web typecheck
          npm run --workspace apps/bootstrap-installer typecheck
          npm run --workspace apps/desktop typecheck
          npm run --workspace apps/shared typecheck
          npm run --workspace apps/desktop build

  site:
    name: site
    needs: classify
    if: needs.classify.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Check generated English skill docs
        run: |
          source .venv/bin/activate
          python website/scripts/generate-skill-docs.py --check

      - name: Run docs and skill source tests
        run: scripts/run_tests.sh tests/skills/test_shipped_skill_source_hygiene.py tests/website/test_generate_skill_docs.py -q --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  basic:
    name: basic
    if: always()
    needs: [classify, python, frontend, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify conditional lane results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PYTHON_REQUIRED: ${{ needs.classify.outputs.python }}
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_REQUIRED: ${{ needs.classify.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SITE_REQUIRED: ${{ needs.classify.outputs.site }}
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]] || {
            echo "classify failed: $CLASSIFY_RESULT" >&2
            exit 1
          }
          verify_lane() {
            local name="$1" required="$2" result="$3"
            if [[ "$required" == "true" ]]; then
              [[ "$result" == "success" ]] || {
                echo "$name was required but finished as $result" >&2
                exit 1
              }
            elif [[ "$required" == "false" ]]; then
              [[ "$result" == "skipped" || "$result" == "success" ]] || {
                echo "$name was irrelevant but finished as $result" >&2
                exit 1
              }
            else
              echo "$name classifier output was invalid: ${required:-<empty>}" >&2
              exit 1
            fi
          }
          verify_lane python "$PYTHON_REQUIRED" "$PYTHON_RESULT"
          verify_lane frontend "$FRONTEND_REQUIRED" "$FRONTEND_RESULT"
          verify_lane site "$SITE_REQUIRED" "$SITE_RESULT"

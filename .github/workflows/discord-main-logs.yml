name: Discord Main Commit Logs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: notify-discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Post commits to Discord logs
        env:
          DISCORD_LOGS_WEBHOOK_URL: ${{ secrets.DISCORD_LOGS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/notify_discord_main_commits.py

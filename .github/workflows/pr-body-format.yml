name: PR Body Format

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # This trusted-base validation must not share the untrusted source-CI group.
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: pr body
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Fetch exact PR commits without checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD^{commit})" == "$BASE_SHA" ]]
          git fetch --no-tags --depth=256 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          resolved_head="$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head^{commit}")"
          [[ "$resolved_head" == "$HEAD_SHA" ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Run trusted-base source-CI preflight
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/source_ci_preflight.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-number "$PR_NUMBER"

      - name: Collect changed file names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate \
            --jq '.[].filename' > "$RUNNER_TEMP/pr_changed_files.txt"

      - name: Check PR body Markdown and project-state hygiene
        run: python scripts/check_pr_body_format.py --event-path "$GITHUB_EVENT_PATH" --changed-files "$RUNNER_TEMP/pr_changed_files.txt"

name: Docs Source Integrity

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - 'skills/**'
      - 'optional-skills/**'
      - 'website/**'
      - 'tests/skills/test_shipped_skill_source_hygiene.py'
      - 'tests/website/test_generate_skill_docs.py'
      - '.github/workflows/docs-source-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - 'skills/**'
      - 'optional-skills/**'
      - 'website/**'
      - 'tests/skills/test_shipped_skill_source_hygiene.py'
      - 'tests/website/test_generate_skill_docs.py'
      - '.github/workflows/docs-source-integrity.yml'

permissions:
  contents: read

concurrency:
  group: docs-source-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-source-integrity:
    name: docs-source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Check generated English skill docs
        run: |
          source .venv/bin/activate
          python website/scripts/generate-skill-docs.py --check

      - name: Run docs and skill source tests
        run: |
          scripts/run_tests.sh tests/skills/test_shipped_skill_source_hygiene.py tests/website/test_generate_skill_docs.py -q --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
